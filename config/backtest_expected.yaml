# Backtest 期望值 — 所有策略的 single source of truth
#
# 用途：
#   - alpha_decay_monitor.py 用 win_rate / mean_net 比對實單 drift
#   - kelly_position_sizing.py 用 win_rate / avg_win / avg_loss 算倉位
#   - monthly_health_check.py 用所有欄位產出健康報告
#
# 欄位定義：
#   win_rate      — 勝率（小數）
#   avg_win       — 贏的平均報酬 %（扣成本後）
#   avg_loss      — 輸的平均報酬 %（扣成本後，負值）
#   mean_net     — 全體平均報酬 % = p*avg_win + (1-p)*avg_loss
#   n_per_year   — 年觸發次數估計
#   regime_dep    — 是否 regime-dependent（true 則 LATE_BULL/熊市暫停）
#   source        — 數據來源（哪份 backtest 報告）
#   hold_days     — 預設 hold 期（用於 paper ledger 平倉）
#   note          — 備註
#
# 更新規則：跑新的 backtest 後，把 win_rate / avg_win / avg_loss 等改在這裡。
# alpha_decay_monitor 與 kelly_position_sizing 會自動讀。

