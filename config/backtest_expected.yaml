config:
  cost_pct_round_trip: 0.34   # 3折 fee + 0.3% tax + slippage
  default_hold_days: 20
  drift_warn_threshold: -0.30   # alpha_decay：drift < -30% 警報
  drift_severe_threshold: -0.50 # drift < -50% 嚴重
  min_samples_for_eval: 10      # n < 10 不評估
  dynamic_kelly_min_trades: 10  # 累積 ≥ N 後 Kelly 改用實單
